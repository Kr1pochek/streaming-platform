services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${PGDATABASE:-music_app}
      POSTGRES_USER: ${PGUSER:-postgres}
      POSTGRES_PASSWORD: ${PGPASSWORD:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 12

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGPORT: 5432
      PGDATABASE: ${PGDATABASE:-music_app}
      PGUSER: ${PGUSER:-postgres}
      PGPASSWORD: ${PGPASSWORD:-postgres}
      NODE_ENV: production
      API_HOST: 0.0.0.0
      API_PORT: 4000
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:4000,http://127.0.0.1:4000}
      TRUST_PROXY: ${TRUST_PROXY:-false}
      SERVE_CLIENT: ${SERVE_CLIENT:-true}
      PASSWORD_RESET_RETURN_TOKEN: ${PASSWORD_RESET_RETURN_TOKEN:-false}
      PLAYBACK_SIGNING_SECRET: ${PLAYBACK_SIGNING_SECRET:-}
      PLAYBACK_REQUIRE_SIGNED: ${PLAYBACK_REQUIRE_SIGNED:-false}
      PLAYBACK_EMBED_SIGNED_URL: ${PLAYBACK_EMBED_SIGNED_URL:-true}
      PLAYBACK_URL_TTL_MS: ${PLAYBACK_URL_TTL_MS:-900000}
      PLAYBACK_EMBED_URL_TTL_MS: ${PLAYBACK_EMBED_URL_TTL_MS:-21600000}
      DB_WAIT_RETRIES: ${DB_WAIT_RETRIES:-40}
      DB_WAIT_INTERVAL_MS: ${DB_WAIT_INTERVAL_MS:-2000}
      MEDIA_STORAGE_DRIVER: ${MEDIA_STORAGE_DRIVER:-local}
      MEDIA_CDN_BASE_URL: ${MEDIA_CDN_BASE_URL:-}
      MEDIA_S3_ENDPOINT: ${MEDIA_S3_ENDPOINT:-}
      MEDIA_S3_REGION: ${MEDIA_S3_REGION:-us-east-1}
      MEDIA_S3_BUCKET: ${MEDIA_S3_BUCKET:-}
      MEDIA_S3_ACCESS_KEY_ID: ${MEDIA_S3_ACCESS_KEY_ID:-}
      MEDIA_S3_SECRET_ACCESS_KEY: ${MEDIA_S3_SECRET_ACCESS_KEY:-}
      MEDIA_S3_FORCE_PATH_STYLE: ${MEDIA_S3_FORCE_PATH_STYLE:-true}
      MEDIA_S3_PREFIX: ${MEDIA_S3_PREFIX:-audio}
      MEDIA_S3_PUBLIC_BASE_URL: ${MEDIA_S3_PUBLIC_BASE_URL:-}
      MEDIA_S3_ACL: ${MEDIA_S3_ACL:-}
      GENERATE_HLS_ON_UPLOAD: ${GENERATE_HLS_ON_UPLOAD:-true}
      FFMPEG_PATH: ${FFMPEG_PATH:-ffmpeg}
      FFPROBE_PATH: ${FFPROBE_PATH:-ffprobe}
      PORTABLE_SNAPSHOT_FORCE_RESTORE: ${PORTABLE_SNAPSHOT_FORCE_RESTORE:-false}
      PORTABLE_SNAPSHOT_RESTORE_MEDIA: ${PORTABLE_SNAPSHOT_RESTORE_MEDIA:-true}
    command: ["node", "scripts/start-app.mjs"]
    ports:
      - "4000:4000"
    volumes:
      - media_data:/app/public/audio
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4000/api/ready').then((response)=>process.exit(response.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

volumes:
  postgres_data:
  media_data:
