services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: music_app
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d music_app"]
      interval: 5s
      timeout: 5s
      retries: 12

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGPORT: 5432
      PGDATABASE: music_app
      PGUSER: postgres
      PGPASSWORD: postgres
      NODE_ENV: production
      API_HOST: 0.0.0.0
      API_PORT: 4000
      CORS_ORIGINS: http://localhost:4000,http://127.0.0.1:4000
      TRUST_PROXY: "false"
      SERVE_CLIENT: "true"
      PASSWORD_RESET_RETURN_TOKEN: "false"
      DB_WAIT_RETRIES: 40
      DB_WAIT_INTERVAL_MS: 2000
    command: ["node", "scripts/start-app.mjs"]
    ports:
      - "4000:4000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4000/api/ready').then((response)=>process.exit(response.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

volumes:
  postgres_data:
